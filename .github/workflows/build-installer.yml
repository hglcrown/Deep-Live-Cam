name: Build Windows Installer
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Release'
        required: false
        default: 'false'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --force-reinstall --no-deps opencv-python==4.14.0.94

      - name: Pre-download AI model (inswapper_128.onnx ~554MB)
        shell: bash
        run: |
          mkdir -p models
          echo "Downloading inswapper_128.onnx from hf-mirror (China-friendly)..."
          curl -L -f --connect-timeout 30 --max-time 600 -o models/inswapper_128.onnx \
            "https://hf-mirror.com/hacksider/deep-live-cam/resolve/main/inswapper_128.onnx"
          echo "Model size: $(ls -la models/inswapper_128.onnx | awk '{print $5}') bytes"
          if [ ! -s models/inswapper_128.onnx ]; then
            echo "ERROR: Model download failed or file is empty"
            exit 1
          fi

      - name: Build executable (onedir + bundled model)
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed \
            --name "DeepLiveCam" \
            --add-data "modules;modules" \
            --add-data "locales;locales" \
            --add-data "media;media" \
            --add-data "models;models" \
            --hidden-import=insightface \
            --hidden-import=onnxruntime \
            --hidden-import=onnxruntime_providers_cuda \
            --hidden-import=onnxruntime_providers_dml \
            --hidden-import=onnxruntime_providers_openvino \
            --hidden-import=opennsfw2 \
            --hidden-import=keras \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --hidden-import=PySide6.QtNetwork \
            --collect-all insightface \
            --collect-all onnxruntime \
            run.py

      - name: Verify model is bundled
        shell: bash
        run: |
          if [ -f dist/DeepLiveCam/models/inswapper_128.onnx ]; then
            echo "Model bundled OK ($(ls -la dist/DeepLiveCam/models/inswapper_128.onnx | awk '{print $5}') bytes)"
          else
            echo "WARNING: Model not found in dist — app will try downloading at runtime"
            find dist/DeepLiveCam -name "*.onnx" 2>/dev/null | head -5 || true
          fi

      - name: Install NSIS
        run: choco install nsis -y

      - name: Compile installer
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "Deep-Live-Cam_installer.exe"
          if-no-files-found: error

      - name: Publish Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: "Deep-Live-Cam_installer.exe"
          tag_name: installer-build
          name: Windows Installer Build
